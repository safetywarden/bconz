name: RDIA-DRA CI

on:
  pull_request:
    paths:
      - 'src/lib/research/**'
      - 'src/app/api/research/**'
      - 'supabase/migrations/**'
      - '.github/workflows/rdia-dra-ci.yml'
  push:
    branches:
      - feature/rdia-dra-agents
    paths:
      - 'src/lib/research/**'
      - 'src/app/api/research/**'
      - 'supabase/migrations/**'
      - '.github/workflows/rdia-dra-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
